# Settings for building Ladder as a GraalVM native image (mvn -Pnative package).
# TamboUI's Panama backend talks to the terminal through the foreign function API, and the game
# reads its levels and TamboUI its key bindings as resources.
Args = --no-fallback \
       -H:+UnlockExperimentalVMOptions \
       -H:+ForeignAPISupport \
       --enable-native-access=ALL-UNNAMED \
       -H:IncludeResources=levels/.*|dev/tamboui/.*\\.properties
